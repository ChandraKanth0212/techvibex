version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: railopt_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railopt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railopt_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-railopt_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railopt} -d ${POSTGRES_DB:-railopt_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: railopt_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
