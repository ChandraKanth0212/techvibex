[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "railopt-contracts"
version = "0.1.0"
description = "Canonical Data Contracts for RailOpt SIH 2026 Modules"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
